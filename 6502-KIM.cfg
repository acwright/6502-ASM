# ***                                      ***
# ***     AC6502 KIM — LINKER CONFIG       ***
# ***                                      ***
#
# Program RAM on the KIM runs $0800-$7FFF. Below $0800 is the machine's own
# workspace: zero page, the stack, the input buffer at $0200, the Kernal
# variables at $0300, and the FS sector buffer at $0600.
#
# Unlike the rest of the AC6502 family there is no BASIC here — the Keypad
# Card overlays $C000-$FFFF — so programs need no tokenized startup stub.
# Execution begins at the first byte of CODE, at $0800.

MEMORY {
  RAM: start=$0800, size=$7800, file="%O";
}

SEGMENTS {
  CODE: load=RAM, type=rw;
}
