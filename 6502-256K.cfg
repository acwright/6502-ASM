  BANK1B:  start=$C000, size=$2000, file="%O", fill=yes, fillval=$FF;
  BANK1C:  start=$C000, size=$2000, file="%O", fill=yes, fillval=$FF;
  BANK1D:  start=$C000, size=$2000, file="%O", fill=yes, fillval=$FF;
  BANK1E:  start=$C000, size=$2000, file="%O", fill=yes, fillval=$FF;
  FIXED:   start=$E000, size=$1FFA, file="%O", fill=yes, fillval=$FF;  # always visible, whatever the register holds (bank $1F)
  VECTORS: start=$FFFA, size=$0006, file="%O", fill=yes, fillval=$FF;  # NMI, RESET, IRQ — never bankable
}

